<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}LinkedIn (fixture){% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f2ee; color: #1d1d1d; }
    .global-nav { background: #fff; padding: 8px 24px; border-bottom: 1px solid #ddd; }
    main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .feed-shared-update-v2 { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .update-components-actor__meta-link { display: block; color: inherit; text-decoration: none; }
    .update-components-actor__title { font-weight: 600; display: block; }
    .update-components-actor__description, .update-components-actor__sub-description { color: #666; font-size: 14px; display: block; }
    .update-components-text { white-space: pre-line; margin-top: 8px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .fixture-banner { background: #fff3cd; padding: 4px 24px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="fixture-banner">FIXTURE MODE — fake LinkedIn served by sales0</div>
  {% block nav %}<nav class="global-nav" aria-label="Primary"><strong>in</strong> Home · My Network · Jobs · Messaging</nav>{% endblock %}
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
