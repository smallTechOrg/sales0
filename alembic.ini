# Alembic config. The database URL is NOT set here: migrations/env.py reads it from
# sales0.config (SALES0_DATABASE_URL, default sqlite:///data/sales0.db at the repo root).
# Run from the repo root:  uv run alembic upgrade head  /  uv run alembic current

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
