[project]
name = "sales0"
version = "0.1.0"
description = "AI sales and marketing agent for smallTech: LinkedIn discovery, AI triage, review inbox."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "anthropic>=0.40",
    "playwright>=1.45",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-playwright>=0.5",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales0"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not eval'"
timeout = 120
markers = [
    "llm: makes a real Anthropic (Haiku) call using the key from .env",
    "browser: drives a real Playwright Chromium",
    "e2e: live server subprocess + headless Chromium + real Haiku",
    "eval: ground-truth triage eval against the real sheets (network + real Haiku); excluded from the default run",
    "chrome: needs the installed Google Chrome (real headless Chrome; Phase 1.1)",
]
